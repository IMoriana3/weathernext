name: Validate read-only transport

on:
  push:
    branches: [main, feat/zarr-point-reader]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned transport dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Compile source
        run: python -m compileall -q point_reader.py tests
      - name: Validate interactive export shell syntax
        run: bash -n scripts/cloudshell_latest.sh
      - name: Exercise synthetic point datasets without upstream access
        run: python -m unittest discover -s tests -v
