name: WeatherNext 3 approved ingestion

# Manual auth-check does not require Supabase credentials or publishing approval.
# Publication and scheduled cycles require explicit repository approval.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test Google identity only, or publish an approved run"
        type: choice
        options: ["auth-check", "publish"]
        default: "auth-check"
        required: true
      hours:
        description: "Forecast horizon for an approved publish run"
        type: choice
        options: ["24", "72", "360"]
        default: "24"
        required: true
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: wn3-ingestion-single-writer
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'auth-check') || vars.WN3_INGESTION_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate Google Cloud with approved OIDC workload identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WN3_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.WN3_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Check Google WIF and WeatherNext GCS access without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'auth-check' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          timeout 30s gcloud auth print-access-token >/dev/null
          # Probe an exact, previously read real Zarr v3 metadata object.
          # A directory-like prefix may trigger a misleading object GET on
          # a nonexistent folder. This source object was certified by the
          # operator's 360-hour historical replay; no forecast data is read.
          timeout 90s gcloud storage ls \
            gs://weathernext3_statistics_spatial/weathernext_3_0_0_statistics/zarr/2026_to_present/20261019_06hr_01_preds/predictions.zarr/zarr.json >/dev/null
          # Discovery needs storage.objects.list on one dated prefix too.
          timeout 90s gcloud storage ls \
            "gs://weathernext3_statistics_spatial/weathernext_3_0_0_statistics/zarr/2026_to_present/20261019_*" >/dev/null
          echo "WN3_GCP_AUTH_AND_LIST_OK (no Supabase write or forecast export)"
      - name: Install pinned transport dependencies for reader probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'auth-check' }}
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Check the ingest GCS client (obstore + WIF ADC) reads root metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'auth-check' }}
        shell: bash
        run: |
          set -euo pipefail
          # gcloud success does not prove obstore can use the same WIF ADC.
          timeout 120s python -m scripts.probe_metadata \
            --run-prefix weathernext_3_0_0_statistics/zarr/2026_to_present/20261019_06hr_01_preds/predictions.zarr
      - name: Install pinned transport dependencies
        if: ${{ vars.WN3_INGESTION_APPROVED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Discover, validate and conditionally publish native point forecast
        if: ${{ vars.WN3_INGESTION_APPROVED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
        shell: bash
        env:
          WN3_INGESTION_APPROVED: "true"
          WN3_SUPABASE_URL: ${{ vars.WN3_SUPABASE_URL }}
          WN3_SUPABASE_SECRET_KEY: ${{ secrets.WN3_SUPABASE_SECRET_KEY }}
          WN3_PLANTA_ID: ${{ vars.WN3_PLANTA_ID }}
          WN3_SITE_CODE: ${{ vars.WN3_SITE_CODE }}
          WN3_SITE_LAT: ${{ vars.WN3_SITE_LAT }}
          WN3_SITE_LON: ${{ vars.WN3_SITE_LON }}
          WN3_HOURS: ${{ github.event.inputs.hours || '24' }}
        run: |
          set -euo pipefail
          python scheduled_ingest.py \
            --planta-id "$WN3_PLANTA_ID" \
            --site-code "$WN3_SITE_CODE" \
            --lat "$WN3_SITE_LAT" \
            --lon "$WN3_SITE_LON" \
            --hours "$WN3_HOURS" \
            --checkpoint-dir "$RUNNER_TEMP/wn3-point-checkpoints" \
            --publish
